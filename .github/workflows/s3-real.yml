name: S3 real tier

# Opt-in tier that runs the storage tests against REAL AWS S3 (the behaviors the
# offline mock can't prove: SigV4 presigned-URL expiry and IAM-scoped deletes).
# Kept separate from ci.yml so the default gate needs no AWS secrets.
#
# Auth is via GitHub OIDC: the job assumes the moo-s3-citest IAM role (scoped to
# moo-snapshots-citest-* buckets only) with no long-lived keys. The role ARN is
# stored in the AWS_S3_CITEST_ROLE_ARN repository secret.
#
# Manual-trigger only. On the current AWS account the OIDC assume is denied by a
# managed resource control policy (out-of-org federated principals cannot call
# sts:AssumeRoleWithWebIdentity), so this workflow does not run here; run the tier
# locally with `pytest -m s3_real` using in-org credentials. See docs/deployment.md.

on:
  workflow_dispatch: {}

# Least privilege: id-token to fetch the OIDC token, read to checkout.
permissions:
  id-token: write
  contents: read

jobs:
  s3-real:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_S3_CITEST_ROLE_ARN }}
          aws-region: us-east-2

      - name: Run real-S3 tier
        run: pytest -m s3_real -v
        env:
          MW_ENVIRONMENT: test
          # Real AWS: the endpoint override MUST stay unset so boto3 targets S3.
          MW_S3_REAL_TEST: "1"
          MW_S3_REGION: us-east-2
