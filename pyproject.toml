[project]
name = "mooternity-watch-backend"
version = "0.1.0"
description = "Backend & Systems Integration subsystem for Moo-ternity Watch"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "psycopg[binary]>=3.1,<4.0",
    "boto3>=1.34,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.5,<1.0",
    "pre-commit>=3.7,<5.0",
    # Mocks S3 in-process so storage tests need no running container or AWS
    # credentials (mirrors how DB-backed tests self-skip).
    "moto[s3]>=5.0,<6.0",
    # Used by signing tests to fetch a presigned URL end-to-end.
    "requests>=2.31,<3.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, bugbear
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "s3_real: opt-in tests that run against real AWS S3 (skipped unless real-S3 env vars are set)",
]
